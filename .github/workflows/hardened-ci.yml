name: Hardened V1 CI

on:
  push:
    branches:
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-suite:
    name: Full suite / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev

  hardening-surface:
    name: Hardened surface invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/chat-allowlist.test.mjs test/mcp-tools.test.mjs test/core-config-storage.test.mjs test/application.test.mjs test/cli.test.mjs
      - run: npm audit --omit=dev
